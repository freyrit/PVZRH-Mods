name: Validate catalog

on:
  pull_request:
    paths:
      - catalog.json
      - scripts/validate_catalog.py
      - .github/workflows/validate-catalog.yml
  push:
    branches: [main]
    paths:
      - catalog.json
      - scripts/validate_catalog.py
      - .github/workflows/validate-catalog.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_catalog.py
